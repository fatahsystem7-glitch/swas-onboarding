<style>
  html { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

  <header class="bg-slate-900 text-white">
    <div class="mx-auto max-w-5xl px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5">
        <span class="grid place-items-center w-9 h-9 rounded-xl bg-gradient-to-br from-amber-400 to-orange-500 text-slate-900 font-black">SR</span>
        <span class="font-extrabold text-lg tracking-tight">SiteRing <span class="text-slate-400 font-medium text-sm">· Dashboard</span></span>
      </a>
      <a href="/" class="text-sm font-semibold text-slate-300 hover:text-white transition">← Back to site</a>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 sm:px-6 py-8">
    <div class="rounded-2xl bg-white border border-slate-200 p-5 shadow-sm">
      <label class="block text-sm font-semibold text-slate-700 mb-2">Look up a client</label>
      <div class="flex flex-col sm:flex-row gap-3">
        <input id="clientId" type="text" placeholder="Enter client_id (UUID)…" class="flex-1 rounded-xl border border-slate-300 px-4 py-3 focus:border-amber-500 focus:ring-2 focus:ring-amber-200 outline-none transition" />
        <button id="loadBtn" class="rounded-xl bg-slate-900 px-6 py-3 text-sm font-bold text-white hover:bg-slate-800 transition">Load</button>
      </div>
    </div>

    <div id="profile" class="hidden mt-6 rounded-2xl bg-white border border-slate-200 p-6 shadow-sm"></div>

    <div id="callsSection" class="hidden mt-6">
      <h2 id="callsHeading" class="text-sm font-bold uppercase tracking-wide text-slate-500 mb-3">Calls</h2>
      <div id="calls" class="rounded-2xl bg-white border border-slate-200 shadow-sm divide-y divide-slate-100"></div>
    </div>

    <p id="msg" class="mt-6 text-slate-500">Enter a client ID above to view their profile and calls.</p>
  </main>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function statusBadge(status) {
    const s = (status || '').toUpperCase();
    let cls = 'bg-amber-100 text-amber-700';
    if (s === 'ACTIVE') cls = 'bg-green-100 text-green-700';
    else if (s.includes('REJECT')) cls = 'bg-rose-100 text-rose-700';
    return `<span class="inline-block rounded-full px-2.5 py-0.5 text-xs font-semibold ${cls}">${esc(s || 'UNKNOWN')}</span>`;
  }
  function fmtDate(d) { if (!d) return '—'; try { return new Date(d).toLocaleString('en-GB'); } catch { return d; } }
  function fmtDuration(secs) { if (secs == null) return ''; const m = Math.floor(secs/60), s = secs%60; return ` · ${m}m ${String(s).padStart(2,'0')}s`; }

  async function load() {
    const id = $('clientId').value.trim();
    if (!id) return;
    $('msg').className = 'mt-6 text-slate-500';
    $('msg').textContent = 'Loading…';
    $('profile').classList.add('hidden');
    $('callsSection').classList.add('hidden');
    try {
      const [pRes, cRes] = await Promise.all([
        fetch(`/api/clients/${encodeURIComponent(id)}`),
        fetch(`/api/clients/${encodeURIComponent(id)}/calls`),
      ]);
      if (!pRes.ok) throw new Error(pRes.status === 404 ? 'Client not found.' : `Profile error (${pRes.status})`);
      const p = await pRes.json();
      const c = cRes.ok ? await cRes.json() : { calls: [] };
      renderProfile(p);
      renderCalls(c.calls || []);
      $('msg').textContent = '';
    } catch (err) {
      $('msg').className = 'mt-6 text-rose-600 font-medium';
      $('msg').textContent = err.message || 'Failed to load.';
    }
  }

  function field(label, val) {
    return `<div><div class="text-[11px] uppercase tracking-wide text-slate-400 font-semibold">${label}</div><div class="mt-0.5 font-semibold text-slate-900">${val}</div></div>`;
  }
  function renderProfile(p) {
    $('profile').innerHTML = `
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-5">
        ${field('Business', esc(p.business_name))}
        ${field('Contact', esc(p.contact_name || '—'))}
        ${field('Email', esc(p.email))}
        ${field('AI Number', esc(p.telnyx_number || 'Pending'))}
        ${field('Status', statusBadge(p.status))}
        ${field('Emergency Fwd', esc(p.emergency_number || '—'))}
      </div>`;
    $('profile').classList.remove('hidden');
  }

  function renderCalls(calls) {
    $('callsSection').classList.remove('hidden');
    $('callsHeading').textContent = `Calls (${calls.length})`;
    if (!calls.length) { $('calls').innerHTML = `<div class="p-6 text-slate-500">No calls recorded yet.</div>`; return; }
    $('calls').innerHTML = calls.map(call => `
      <div class="p-5">
        <div class="flex items-center justify-between gap-3 flex-wrap">
          <span class="font-semibold text-slate-900">${esc(call.caller_number)}${call.is_lead ? ' <span class="ml-1 rounded-full bg-indigo-100 text-indigo-700 px-2 py-0.5 text-[11px] font-semibold">LEAD</span>' : ''}</span>
          <span class="text-sm text-slate-500">${fmtDate(call.created_at)}${fmtDuration(call.duration_seconds)}</span>
        </div>
        ${call.summary ? `<p class="mt-2 text-sm text-slate-700">${esc(call.summary)}</p>` : ''}
        ${call.recording_url ? `<audio controls preload="none" src="${esc(call.recording_url)}" class="mt-3 w-full"></audio>` : ''}
        ${call.transcript ? `<details class="mt-2"><summary class="text-sm text-slate-500 cursor-pointer">View transcript</summary><pre class="mt-2 whitespace-pre-wrap rounded-lg bg-slate-900 text-slate-100 p-3 text-sm">${esc(call.transcript)}</pre></details>` : ''}
      </div>`).join('');
  }

  $('loadBtn').addEventListener('click', load);
  $('clientId').addEventListener('keydown', (e) => { if (e.key === 'Enter') load(); });
  const qs = new URLSearchParams(location.search);
  if (qs.get('client_id')) { $('clientId').value = qs.get('client_id'); load(); }
</script>
</body>
</html>
